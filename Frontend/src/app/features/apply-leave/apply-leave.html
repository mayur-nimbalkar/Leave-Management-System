<div class="page-container">
  <div class="page-header">
    <h1>Apply for Leave</h1>
    <p>Submit a new leave request for approval</p>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="leave-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Leave Type</mat-label>
          <mat-select formControlName="leaveType">
            <mat-option *ngFor="let type of leaveTypes" [value]="type.value">
              {{ type.label }}
            </mat-option>
          </mat-select>
          <mat-error>Leave type is required</mat-error>
        </mat-form-field>

        <div class="date-row">
          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
            <mat-error>Start date is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
            <mat-error>End date is required</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reason</mat-label>
          <textarea matInput rows="4" formControlName="reason" maxlength="200"></textarea>
          <mat-hint align="end">{{ leaveForm.get('reason')?.value?.length || 0 }}/200</mat-hint>
          <mat-error>Reason is required (max 200 characters)</mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isSubmitting || leaveForm.invalid"
        >
          <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
          {{ isSubmitting ? 'Submitting...' : 'Submit Application' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
