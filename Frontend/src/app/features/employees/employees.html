<div class="page-container">
  <div class="page-header">
    <h1>Department Employees</h1>
    <p>Leave activity summary for your department</p>
  </div>

  <div *ngIf="isLoading" class="loading-center">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="!isLoading && employees.length === 0" class="empty-state">
    <mat-icon>people</mat-icon>
    <p>No employee leave data found</p>
  </div>

  <table
    *ngIf="!isLoading && employees.length > 0"
    mat-table
    [dataSource]="employees"
    class="full-width-table"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Employee</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef>Department</th>
      <td mat-cell *matCellDef="let row">{{ row.department | uppercase }}</td>
    </ng-container>

    <ng-container matColumnDef="pending">
      <th mat-header-cell *matHeaderCellDef>Pending</th>
      <td mat-cell *matCellDef="let row">
        <span class="status-pending">{{ row.pending }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="approved">
      <th mat-header-cell *matHeaderCellDef>Approved</th>
      <td mat-cell *matCellDef="let row">
        <span class="status-approved">{{ row.approved }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="rejected">
      <th mat-header-cell *matHeaderCellDef>Rejected</th>
      <td mat-cell *matCellDef="let row">
        <span class="status-rejected">{{ row.rejected }}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
