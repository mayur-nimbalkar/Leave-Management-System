<div class="page-container">
  <div class="page-header">
    <h1>Pending Approvals</h1>
    <p>Review and approve leave requests from your department</p>
  </div>

  <div *ngIf="isLoading" class="loading-center">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="!isLoading && leaves.length === 0" class="empty-state">
    <mat-icon>check_circle</mat-icon>
    <p>No pending leave requests</p>
  </div>

  <table
    *ngIf="!isLoading && leaves.length > 0"
    mat-table
    [dataSource]="leaves"
    class="full-width-table"
  >
    <ng-container matColumnDef="employee">
      <th mat-header-cell *matHeaderCellDef>Employee</th>
      <td mat-cell *matCellDef="let row">{{ employeeName(row) }}</td>
    </ng-container>

    <ng-container matColumnDef="leaveType">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let row">{{ row.leaveType }}</td>
    </ng-container>

    <ng-container matColumnDef="dates">
      <th mat-header-cell *matHeaderCellDef>Dates</th>
      <td mat-cell *matCellDef="let row">
        {{ formatDate(row.startDate) }} – {{ formatDate(row.endDate) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="duration">
      <th mat-header-cell *matHeaderCellDef>Days</th>
      <td mat-cell *matCellDef="let row">{{ row.duration }}</td>
    </ng-container>

    <ng-container matColumnDef="reason">
      <th mat-header-cell *matHeaderCellDef>Reason</th>
      <td mat-cell *matCellDef="let row">{{ row.reason }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <div class="action-buttons">
          <button
            mat-raised-button
            color="primary"
            (click)="approve(row)"
            [disabled]="processingId === row._id"
          >
            Approve
          </button>
          <button
            mat-stroked-button
            color="warn"
            (click)="reject(row)"
            [disabled]="processingId === row._id"
          >
            Reject
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
