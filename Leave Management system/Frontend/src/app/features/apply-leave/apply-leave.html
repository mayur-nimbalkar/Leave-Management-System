<section class="apply-leave-page fade-in">
  <mat-card class="form-card">
    <div class="card-header">
      <mat-icon>event_note</mat-icon>
      <div>
        <h2>Apply for Leave</h2>
        <p>Submit a new request for your team to review.</p>
      </div>
    </div>

    <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="leave-form">
      <mat-form-field appearance="outline">
        <mat-label>Leave Type</mat-label>
        <mat-select formControlName="leaveType">
          <mat-option *ngFor="let type of leaveTypes" [value]="type">{{ type }}</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="row-fields">
        <mat-form-field appearance="outline">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Reason</mat-label>
        <textarea matInput rows="4" formControlName="reason"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting">
        <mat-icon>send</mat-icon>
        {{ isSubmitting ? 'Submitting...' : 'Submit Request' }}
      </button>
    </form>
  </mat-card>
</section>
