<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <mat-icon class="header-icon">login</mat-icon>
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" formControlName="email" />
        <mat-icon matPrefix>email</mat-icon>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Please enter a valid email address
        </mat-error>
      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" />
        <button
          type="button"
          mat-icon-button
          matSuffix
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <!-- Submit Button -->
      <button
        type="submit"
        mat-raised-button
        color="primary"
        class="submit-btn"
        [disabled]="isSubmitting || loginForm.invalid"
      >
        <mat-icon *ngIf="!isSubmitting">login</mat-icon>
        <mat-spinner *ngIf="isSubmitting" diameter="20" class="inline-spinner"></mat-spinner>
        {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
      </button>

      <!-- Register Link -->
      <div class="register-link">
        <span>Don't have an account?</span>
        <a mat-button routerLink="/register">Register Here</a>
      </div>
    </form>
  </div>
</div>
