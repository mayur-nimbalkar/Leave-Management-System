<section class="employee-page fade-in">
  <mat-card class="page-card">
    <div class="card-header">
      <div>
        <h2>Employee Directory</h2>
        <p>Quick view of team members and departments.</p>
      </div>
    </div>

    <div class="employee-list">
      <mat-card *ngFor="let employee of employees" class="employee-item">
        <div>
          <h3>{{ employee.name }}</h3>
          <p>{{ employee.department }} • {{ employee.role }}</p>
        </div>
        <button mat-stroked-button color="primary">View</button>
      </mat-card>
    </div>
  </mat-card>
</section>
